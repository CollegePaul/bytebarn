{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Change password &mdash; ByteBarn{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-5">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <h1 class="h3 mb-1">Change password</h1>
        <p class="text-body-secondary mb-4">Pick something you have not used before.</p>

        <form method="post" novalidate>
          {% csrf_token %}
          {{ form|crispy }}
          <button type="submit" class="btn btn-primary w-100 mt-2">Change password</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
